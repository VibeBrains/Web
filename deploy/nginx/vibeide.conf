# nginx site for vibeide.ru → static landing in /var/www/vibeide.ru.
# Deployed from the VibeIDE.ru repo (scripts/deploy.sh syncs the files only).
#
# HTTP/2 is enabled via the `listen ... http2` form (nginx 1.22 — the `http2 on;` directive
# only exists from 1.25). TLSv1.3 is disabled deliberately: on this network 443 with TLSv1.3
# gets throttled, so only TLSv1.2 is offered.

server {
    listen 80;
    listen [::]:80;
    server_name vibeide.ru www.vibeide.ru;

    # ACME renewals answer over plain HTTP; everything else goes to TLS.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vibeide.ru www.vibeide.ru;

    ssl_certificate     /etc/letsencrypt/live/vibeide.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vibeide.ru/privkey.pem;

    # TLSv1.3 disabled deliberately — see the header note.
    ssl_protocols TLSv1.2;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /var/www/vibeide.ru;
    index index.html;

    # Static landing: hashless filenames, so HTML must never be cached hard —
    # a stale index.html would keep serving yesterday's download links.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=604800";
    }
    location / {
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 1024;
}
